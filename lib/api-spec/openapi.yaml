openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: NSE Stock Market Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: giftnifty
    description: Gift Nifty data
  - name: nse
    description: NSE Indian stock market
  - name: commodities
    description: Live commodity prices and movement predictions
  - name: global
    description: Global index data (NYSE, Shanghai, Hang Seng)
  - name: portfolio
    description: User portfolio
  - name: settings
    description: API settings
  - name: insights
    description: Stock insights, indicators and news
  - name: holding
    description: Holding Stocks — ranked 1-3 month positional opportunities

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /decision-engine:
    get:
      operationId: getDecisionPanel
      tags: [decision]
      summary: Get full trading decision panel
      description: Returns market status, key levels (pivot points S1/R1/S2/R2), trade decision (BUY/SELL/WAIT), market pressure, money flow, and signals table for top 10 stocks
      responses:
        "200":
          description: Decision panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPanel"

  /gift-nifty/quote:
    get:
      operationId: getGiftNiftyQuote
      tags: [giftnifty]
      summary: Get Gift Nifty current quote
      description: Returns Gift Nifty current price, yesterday high/low and change percentage
      responses:
        "200":
          description: Gift Nifty quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftNiftyQuote"

  /gift-nifty/history:
    get:
      operationId: getGiftNiftyHistory
      tags: [giftnifty]
      summary: Get Gift Nifty price history
      description: Returns Gift Nifty historical data for last 3 months
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1M, 3M, 6M]
            default: 3M
      responses:
        "200":
          description: Gift Nifty history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

  /gift-nifty/intraday:
    get:
      operationId: getGiftNiftyIntraday
      tags: [giftnifty]
      summary: Get Gift Nifty intraday chart data (today)
      description: Returns real-time intraday price points from NSE India API. Empty when market is closed.
      responses:
        "200":
          description: Intraday price points
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: number
                        price:
                          type: number
                        label:
                          type: string
                      required: [timestamp, price, label]
                  closePrice:
                    type: number
                  source:
                    type: string
                required: [data, closePrice, source]

  /commodities:
    get:
      operationId: getCommodities
      tags: [commodities]
      summary: Get live commodity quotes with prediction and sparkline
      description: Returns Gold, Silver, Crude Oil, Natural Gas, Copper, Platinum, Wheat, Corn, Soybeans with live price, sparkline, and movement prediction
      responses:
        "200":
          description: Live commodity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedAt: { type: string }
                  usdToInr: { type: number }
                  commodities:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommodityItem"
                required: [updatedAt, commodities]

  /commodities/history:
    get:
      operationId: getCommodityHistory
      tags: [commodities]
      summary: Get commodity price history
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1M, 3M, 6M]
            default: 3M
      responses:
        "200":
          description: Commodity price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

  /global-index/quote:
    get:
      operationId: getGlobalIndexQuote
      tags: [global]
      summary: Get global index current quote (Yahoo Finance ~15m delay)
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
            enum: ["^NYA", "000001.SS", "^HSI", "^NSEI"]
      responses:
        "200":
          description: Global index quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalIndexQuote"

  /global-index/history:
    get:
      operationId: getGlobalIndexHistory
      tags: [global]
      summary: Get global index price history (Yahoo Finance)
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
            enum: ["^NYA", "000001.SS", "^HSI", "^NSEI"]
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1M, 3M]
            default: 3M
      responses:
        "200":
          description: Global index history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

  /nse/movers:
    get:
      operationId: getNseMovers
      tags: [nse]
      summary: Get NSE top gainers and losers
      description: Returns top 10 NSE gainers and top 10 NSE losers
      responses:
        "200":
          description: NSE movers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NseMovers"

  /nse/sectors:
    get:
      operationId: getNseSectors
      tags: [nse]
      summary: Get NSE sector performance
      description: Returns performance of all NSE sectors
      responses:
        "200":
          description: NSE sector performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorPerf"

  /nse/quote/{symbol}:
    get:
      operationId: getNseQuote
      tags: [nse]
      summary: Get NSE stock quote
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: NSE stock quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NseStock"

  /nse/history/{symbol}:
    get:
      operationId: getNseHistory
      tags: [nse]
      summary: Get NSE stock history
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 6M, 1Y]
            default: 1M
      responses:
        "200":
          description: NSE stock history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

  /stocks/quotes:
    get:
      operationId: getStockQuotes
      tags: [stocks]
      summary: Get quotes for a comma-separated list of symbols
      parameters:
        - name: symbols
          in: query
          required: false
          description: Comma-separated symbols. Defaults to a built-in list when omitted.
          schema:
            type: string
      responses:
        "200":
          description: Stock quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockQuote"

  /stocks/{symbol}/history:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Get price history for a stock
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 6M, 1Y]
            default: 1M
      responses:
        "200":
          description: Stock history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get the current user's watchlist
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a symbol to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistRequest"
      responses:
        "200":
          description: Added item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"

  /watchlist/{symbol}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a symbol from the watchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get portfolio stocks
      responses:
        "200":
          description: Portfolio stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioStock"
    post:
      operationId: addPortfolioStock
      tags: [portfolio]
      summary: Add stock to portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPortfolioStockRequest"
      responses:
        "200":
          description: Added stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioStock"

  /portfolio/{symbol}:
    delete:
      operationId: removePortfolioStock
      tags: [portfolio]
      summary: Remove stock from portfolio
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /portfolio/{symbol}/indicators:
    get:
      operationId: getStockIndicators
      tags: [portfolio]
      summary: Get VWAP and RSI indicators for a stock
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockIndicators"

  /settings/upstox:
    get:
      operationId: getUpstoxSettings
      tags: [settings]
      summary: Get Upstox API connection status
      responses:
        "200":
          description: Upstox settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstoxSettings"
    post:
      operationId: saveUpstoxSettings
      tags: [settings]
      summary: Save Upstox API credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveUpstoxSettingsRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstoxSettings"

  /holding/scan:
    get:
      operationId: getHoldingScan
      tags: [holding]
      summary: Holding Stocks scan — ranked 1-3 month opportunities
      description: >
        Screens a configurable Indian-equity universe and returns the
        opportunities that clear the MarketPulse Holding Score qualification
        threshold, ranked highest first. Fewer than ten results means fewer
        than ten stocks qualified — the list is never padded. Rebuilt once per
        post-close boundary, not per request.
      parameters:
        - name: universe
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HoldingUniverseId"
          description: Universe to screen. Falls back to the widest available one.
      responses:
        "200":
          description: Holding scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingScan"

  /holding/picks/{symbol}/analysis:
    get:
      operationId: getHoldingAnalysis
      tags: [holding]
      summary: Full breakdown for one Holding Stocks pick
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: NSE symbol as used internally, e.g. RELIANCE
        - name: universe
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HoldingUniverseId"
      responses:
        "200":
          description: Holding analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingAnalysis"
        "404":
          description: Symbol was not part of the scan
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /holding/previous-picks:
    get:
      operationId: getHoldingPreviousPicks
      tags: [holding]
      summary: Previously selected Holding Stocks picks with forward performance
      description: >
        Forward returns are computed from real price history and stay null
        until the corresponding window has actually elapsed.
      responses:
        "200":
          description: Previous picks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingPreviousPicks"

  /suggestions/intraday:
    get:
      operationId: getIntradaySuggestions
      tags: [suggestions]
      summary: Get top 10 intraday stock suggestions
      description: Returns top 10 NSE stocks suggested for intraday trading based on last 24h signals
      responses:
        "200":
          description: Intraday suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockSuggestion"

  /suggestions/options:
    get:
      operationId: getOptionsSuggestions
      tags: [suggestions]
      summary: Get top 10 options stock suggestions
      description: Returns top 10 NSE stocks/indices suggested for options trading
      responses:
        "200":
          description: Options suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptionsSuggestion"

  /suggestions/options/{id}/analysis:
    get:
      operationId: getOptionsAnalysis
      tags: [analysis]
      summary: AI Decision Breakdown for one options pick
      description: >
        Multi-timeframe AI explainability for a single options pick, addressed by
        SYMBOL-TYPE-STRIKE (e.g. WIPRO-PE-180). Computed on demand.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Pick identifier in the form SYMBOL-TYPE-STRIKE
      responses:
        "200":
          description: AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysis"
        "404":
          description: No analysis available for that pick
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /suggestions/intraday/{symbol}/analysis:
    get:
      operationId: getIntradayAnalysis
      tags: [analysis]
      summary: AI Decision Breakdown for one intraday pick
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysis"
        "404":
          description: No analysis available for that symbol
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /commodities/{symbol}/analysis:
    get:
      operationId: getCommodityAnalysis
      tags: [analysis]
      summary: AI Decision Breakdown for one commodity
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Yahoo Finance futures symbol, e.g. GC=F
      responses:
        "200":
          description: AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysis"
        "404":
          description: No analysis available for that symbol
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /settings/upstox/disconnect:
    post:
      operationId: disconnectUpstox
      tags: [settings]
      summary: Disconnect Upstox API
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /settings/upstox/test:
    post:
      operationId: testUpstoxConnection
      tags: [settings]
      summary: Test Upstox API connection with stored credentials
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstoxTestResult"

  /insights/lookup:
    get:
      operationId: lookupStocks
      tags: [insights]
      summary: Autocomplete stock symbols by ticker or company name
      description: >-
        Layered lookup: the in-process NSE index answers first, then the
        provider search index. Returns an empty list for queries under two
        characters rather than erroring.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Partial ticker or company name (e.g. HDFC, Reliance Ind)
      responses:
        "200":
          description: Matching stocks, best match first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLookupResult"

  /insights/search:
    get:
      operationId: searchInsights
      tags: [insights]
      summary: Search stock insights, indicators and news
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Stock symbol or name (e.g. TCS, RELIANCE, AAPL)
      responses:
        "200":
          description: Stock insights result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResult"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /fo-analyzer:
    post:
      operationId: foAnalyzer
      tags: [insights]
      summary: Analyze F&O trade with AI
      description: Accepts a trade position (CE/PE/FUT) and returns comprehensive AI analysis including direction, confidence, decision, P&L, indicators, insights and intraday chart data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoTradeInput"
      responses:
        "200":
          description: F&O AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoAnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

components:
  schemas:
    PriceCandle:
      type: object
      properties:
        date:
          type: string
        close:
          type: number
        volume:
          type: number
      required: [date, close, volume]

    NewsArticle:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        url:
          type: string
        source:
          type: string
          description: Publisher name as reported by the provider
        publishedAt:
          type: string
          nullable: true
          description: >-
            ISO-8601 publication instant, or null when the provider did not
            supply one. Never substituted with the fetch time.
        thumbnail:
          type: string
      required: [title, description, url, source, publishedAt, thumbnail]

    StockLookupItem:
      type: object
      properties:
        symbol:
          type: string
          description: Provider symbol including exchange suffix (e.g. HDFCBANK.NS)
        displaySymbol:
          type: string
          description: Suffix-stripped symbol for display (e.g. HDFCBANK)
        name:
          type: string
        exchange:
          type: string
      required: [symbol, displaySymbol, name, exchange]

    StockLookupResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/StockLookupItem"
      required: [results]

    InsightsResult:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
          description: Resolved listing exchange (NSE, BSE, or the provider's name)
        priceSource:
          type: string
          description: Provider that supplied the quote and price history
        newsSource:
          type: string
          description: Provider that supplied the news feed
        lastUpdated:
          type: string
          description: ISO-8601 instant this payload was assembled
        newsScanned:
          type: number
          description: Articles examined before relevance filtering
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        rsi:
          type: number
        vwap:
          type: number
        forecast:
          type: string
          enum: [Bullish, Bearish, Neutral]
        sentiment:
          type: string
          enum: [Positive, Negative, Neutral]
        sentimentScore:
          type: number
          description: AI sentiment score 0-100 (0=very negative, 50=neutral, 100=very positive)
        currency:
          type: string
        marketCap:
          type: number
        volume:
          type: number
        fiftyTwoWeekHigh:
          type: number
        fiftyTwoWeekLow:
          type: number
        priceHistory:
          type: array
          items:
            $ref: "#/components/schemas/PriceCandle"
        news:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
      required:
        - symbol
        - name
        - price
        - change
        - changePercent
        - rsi
        - vwap
        - forecast
        - sentiment
        - sentimentScore
        - currency
        - marketCap
        - volume
        - fiftyTwoWeekHigh
        - fiftyTwoWeekLow
        - priceHistory
        - news

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GiftNiftyQuote:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        yesterdayHigh:
          type: number
        yesterdayLow:
          type: number
        yesterdayClose:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        yearHigh:
          type: number
        yearLow:
          type: number
        volume:
          type: number
        updatedAt:
          type: string
        dataSource:
          type: string
          description: "Data source: nse | upstox | yahoo | simulated"
      required:
        - symbol
        - name
        - price
        - change
        - changePercent
        - yesterdayHigh
        - yesterdayLow
        - yesterdayClose
        - open
        - high
        - low
        - volume
        - updatedAt

    PriceHistory:
      type: object
      properties:
        symbol:
          type: string
        period:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/OHLCV"
      required:
        - symbol
        - period
        - data

    OHLCV:
      type: object
      properties:
        timestamp:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - timestamp
        - open
        - high
        - low
        - close
        - volume

    NseStock:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        previousClose:
          type: number
        volume:
          type: number
        marketCap:
          type: number
        sector:
          type: string
        pe:
          type: number
        week52High:
          type: number
        week52Low:
          type: number
      required:
        - symbol
        - name
        - price
        - change
