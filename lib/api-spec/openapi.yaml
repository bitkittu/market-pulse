    # ── AI Decision Breakdown ────────────────────────────────────────────
    # One payload shape shared by options, intraday and commodities so the UI
    # components are written once. Market-specific blocks (greeks, optionChain)
    # are nullable rather than duplicated into parallel schemas.

    Provenance:
      type: string
      description: Where a displayed value actually came from.
      enum: [LIVE, API, CALCULATED, MOCK, STATIC, GENERATED, UNAVAILABLE]

    Direction:
      type: string
      enum: [BULLISH, BEARISH, NEUTRAL]

    Tone:
      type: string
      enum: [positive, negative, neutral]

    TimeframeIndicator:
      type: object
      required: [label, value, tone, marker, provenance]
      properties:
        label:      { type: string }
        value:      { type: string }
        tone:       { $ref: "#/components/schemas/Tone" }
        marker:
          type: string
          description: Text marker so the reading stays readable without colour.
        provenance: { $ref: "#/components/schemas/Provenance" }

    TimeframeTrend:
      type: object
      required: [timeframe, label, caption, direction, strength, directionalScore, indicators, sparkline]
      properties:
        timeframe:        { type: string }
        label:            { type: string }
        caption:          { type: string }
        direction:        { $ref: "#/components/schemas/Direction" }
        strength:
          type: number
          description: 0-100 decisiveness of this timeframe.
        directionalScore:
          type: number
          description: Signed conviction between -1 and 1.
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/TimeframeIndicator"
        sparkline:
          type: array
          items: { type: number }

    MultiTimeframeRow:
      type: object
      required: [label, direction]
      properties:
        label:     { type: string }
        direction: { $ref: "#/components/schemas/Direction" }

    MultiTimeframeSummary:
      type: object
      required: [aligned, alignmentLabel, alignment, alignmentStrength, confidenceBoost, probability, explanation, rows]
      properties:
        aligned:        { type: boolean }
        alignmentLabel: { type: string }
        alignment:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL, CONFLICT]
        alignmentStrength:
          type: string
          enum: [Strong, Moderate, Weak]
        confidenceBoost:
          type: number
          description: Signed points the alignment added to the score. Negative on conflict.
        probability:
          type: string
          enum: [High, Medium, Low]
        verdict:
          type: string
          nullable: true
        explanation: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MultiTimeframeRow"

    ScoreCategory:
      type: object
      required: [key, label, weight, score, contribution, note]
      properties:
        key:          { type: string }
        label:        { type: string }
        weight:       { type: number }
        score:        { type: number }
        contribution: { type: number }
        note:         { type: string }

    SignalScore:
      type: object
      required: [score, band, signal, categories]
      properties:
        score:
          type: number
          description: 0-100 signal strength. Not a probability of profit.
        band: { type: string }
        signal:
          type: string
          enum: [STRONG_BUY, BUY, WATCH, SELL, STRONG_SELL]
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ScoreCategory"

    AnalysisReason:
      type: object
      required: [text, source]
      properties:
        text: { type: string }
        source:
          type: string
          description: Score category this reason was derived from.

    AnalysisRiskFactor:
      type: object
      required: [text, severity]
      properties:
        text: { type: string }
        severity:
          type: string
          enum: [high, medium, low]

    AnalysisMaxRisk:
      type: object
      required: [note, provenance]
      properties:
        amount:     { type: number, nullable: true }
        pct:        { type: number, nullable: true }
        lots:       { type: number, nullable: true }
        lotSize:    { type: number, nullable: true }
        note:       { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }

    AnalysisTradePlan:
      type: object
      required: [currency, entryLow, entryHigh, target1, target2, stopLoss, riskReward, maxRisk]
      properties:
        currency:   { type: string }
        entryLow:   { type: number }
        entryHigh:  { type: number }
        target1:    { type: number }
        target2:    { type: number }
        stopLoss:   { type: number }
        riskReward: { type: string }
        maxRisk:
          $ref: "#/components/schemas/AnalysisMaxRisk"

    AnalysisMetric:
      type: object
      required: [label, value, tone, provenance]
      properties:
        label:      { type: string }
        value:      { type: string }
        badge:      { type: string, nullable: true }
        tone:       { $ref: "#/components/schemas/Tone" }
        provenance: { $ref: "#/components/schemas/Provenance" }

    GreekValue:
      type: object
      required: [label, available]
      properties:
        label:     { type: string }
        value:     { type: string, nullable: true }
        available: { type: boolean }

    AnalysisGreeks:
      type: object
      required: [available, note, values]
      properties:
        available: { type: boolean }
        note:      { type: string }
        values:
          type: array
          items:
            $ref: "#/components/schemas/GreekValue"

    NearbyStrike:
      type: object
      required: [strike, callOi, putOi]
      properties:
        strike: { type: number }
        callOi: { type: number }
        putOi:  { type: number }

    OptionChainContext:
      type: object
      required: [available, note, nearbyStrikes]
      properties:
        available: { type: boolean }
        note:      { type: string }
        pcr:       { type: number, nullable: true }
        callOi:    { type: number, nullable: true }
        putOi:     { type: number, nullable: true }
        oiBuildup: { type: string, nullable: true }
        maxPain:   { type: number, nullable: true }
        moneyness: { type: string, nullable: true }
        nearbyStrikes:
          type: array
          items:
            $ref: "#/components/schemas/NearbyStrike"

    ProvenanceField:
      type: object
      required: [name, provenance]
      properties:
        name:       { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }

    AnalysisProvenance:
      type: object
      required: [signalGeneratedAt, dataUpdatedAt, timeframes, dataSource, engine, engineVersion, mode, fields]
      properties:
        signalGeneratedAt: { type: string }
        dataUpdatedAt:     { type: string }
        timeframes:
          type: array
          items: { type: string }
        dataSource:    { type: string }
        engine:        { type: string }
        engineVersion: { type: string }
        mode:
          type: string
          enum: [MOCK, PARTIAL, LIVE]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProvenanceField"

    AnalysisHeadline:
      type: object
      required: [primaryLabel, primaryValue]
      properties:
        primaryLabel:           { type: string }
        primaryValue:           { type: string }
        primaryChangePercent:   { type: number, nullable: true }
        secondaryLabel:         { type: string, nullable: true }
        secondaryValue:         { type: string, nullable: true }
        secondaryChangePercent: { type: number, nullable: true }

    # ── Holding Stocks ──────────────────────────────────────────────────────
    HoldingUniverseId:
      type: string
      enum: [NIFTY_50, NIFTY_100, NIFTY_200, NIFTY_500]

    HoldingClassification:
      type: string
      description: >
        Setup quality band derived from the MarketPulse Holding Score. Not a
        trade instruction — this module ranks research opportunities.
      enum: [STRONG_SETUP, GOOD_SETUP, WATCH, AVOID]

    HoldingRiskLevel:
      type: string
      enum: [Low, Medium, High]

    HoldingCatalystImpact:
      type: string
      enum: [Positive, Neutral, Negative]

    HoldingPick:
      type: object
      required:
        - rank
        - symbol
        - displaySymbol
        - name
        - sector
        - currentPrice
        - changePercent
        - trendLabel
        - catalystLabel
        - catalystImpact
        - score
        - classification
        - classificationLabel
        - riskLevel
        - isNew
        - priceProvenance
      properties:
        rank:          { type: integer }
        symbol:        { type: string }
        displaySymbol:
          type: string
          description: Exchange ticker spelling, e.g. BAJAJ-AUTO for internal key BAJAJ_AUTO.
        name:          { type: string }
        sector:        { type: string }
        currentPrice:  { type: number }
        changePercent: { type: number }
        return1w:      { type: number, nullable: true }
        return1m:      { type: number, nullable: true }
        return3m:      { type: number, nullable: true }
        distanceFrom52wHighPct: { type: number, nullable: true }
        trendLabel:    { type: string }
        catalystLabel: { type: string }
        catalystImpact:
          $ref: "#/components/schemas/HoldingCatalystImpact"
        score:
          type: number
          description: MarketPulse Holding Score, 0-100 signal quality. Not a probability of profit.
        classification:
          $ref: "#/components/schemas/HoldingClassification"
        classificationLabel: { type: string }
        riskLevel:
          $ref: "#/components/schemas/HoldingRiskLevel"
        isNew:
          type: boolean
          description: Not present in the previous stored scan.
        priceProvenance:
          $ref: "#/components/schemas/Provenance"

    HoldingScanSummary:
      type: object
      required:
        - qualifiedCount
        - published
        - strongSetups
        - newThisScan
        - marketBias
        - marketBiasNote
        - lastScanAt
        - universeRequested
        - universeResolved
        - screened
        - analysed
        - rejectedIlliquid
        - shortlisted
        - belowThreshold
        - qualificationThreshold
      properties:
        qualifiedCount:
          type: integer
          description: Stocks clearing the quality bar. May exceed the published list.
        published:      { type: integer }
        strongSetups:   { type: integer }
        newThisScan:    { type: integer }
        marketBias:
          type: string
          enum: [Bullish, Neutral, Bearish]
        marketBiasNote: { type: string }
        lastScanAt:     { type: string }
        nextScanAt:     { type: string, nullable: true }
        universeRequested:
          $ref: "#/components/schemas/HoldingUniverseId"
        universeResolved:
          $ref: "#/components/schemas/HoldingUniverseId"
        universeNote:   { type: string, nullable: true }
        screened:       { type: integer }
        analysed:       { type: integer }
        rejectedIlliquid: { type: integer }
        shortlisted:
          type: integer
          description: Symbols that reached the deep fundamentals/catalysts pass.
        belowThreshold: { type: integer }
        qualificationThreshold: { type: number }

    HoldingUniverseOption:
      type: object
      required: [id, label, available, note]
      properties:
        id:
          $ref: "#/components/schemas/HoldingUniverseId"
        label:     { type: string }
        available: { type: boolean }
        size:      { type: integer, nullable: true }
        note:      { type: string }

    HoldingScan:
      type: object
      required: [summary, picks, universes, sectors, provenance]
      properties:
        summary:
          $ref: "#/components/schemas/HoldingScanSummary"
        picks:
          type: array
          items:
            $ref: "#/components/schemas/HoldingPick"
        universes:
          type: array
          items:
            $ref: "#/components/schemas/HoldingUniverseOption"
        sectors:
          type: array
          items: { type: string }
        provenance:
          $ref: "#/components/schemas/AnalysisProvenance"

    HoldingAnalysisHeader:
      type: object
      required: [currentPrice, riskLevel, lastScanAt]
      properties:
        currentPrice: { type: number }
        return1m:     { type: number, nullable: true }
        return3m:     { type: number, nullable: true }
        distanceFrom52wHighPct: { type: number, nullable: true }
        riskLevel:
          $ref: "#/components/schemas/HoldingRiskLevel"
        lastScanAt:   { type: string }

    HoldingCatalystEntry:
      type: object
      required: [title, source, impact, kind]
      properties:
        title:  { type: string }
        date:   { type: string, nullable: true }
        source: { type: string }
        impact:
          $ref: "#/components/schemas/HoldingCatalystImpact"
        kind:   { type: string }
        url:    { type: string, nullable: true }

    HoldingCatalystBlock:
      type: object
      required: [available, note, items]
      properties:
        available: { type: boolean }
        note:      { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/HoldingCatalystEntry"

    HoldingFundamentalsBlock:
      type: object
      required: [available, note, items]
      properties:
        available: { type: boolean }
        note:      { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisMetric"

    HoldingOutlook:
      type: object
      required: [trend, momentum, catalyst, risk, overall, note]
      properties:
        trend:
          type: string
          enum: [Strong, Positive, Neutral, Weak]
        momentum:
          type: string
          enum: [Strong, Moderate, Weak]
        catalyst:
          $ref: "#/components/schemas/HoldingCatalystImpact"
        risk:
          $ref: "#/components/schemas/HoldingRiskLevel"
        overall: { type: string }
        note:    { type: string }

    HoldingAnalysis:
      type: object
      required:
        - id
        - symbol
        - displaySymbol
        - name
        - sector
        - classification
        - classificationLabel
        - header
        - score
        - reasons
        - technical
        - momentum
        - fundamentals
        - catalysts
        - risks
        - outlook
        - priceLevels
        - provenance
      properties:
        id:     { type: string }
        symbol: { type: string }
        displaySymbol: { type: string }
        name:   { type: string }
        sector: { type: string }
        classification:
          $ref: "#/components/schemas/HoldingClassification"
        classificationLabel: { type: string }
        header:
          $ref: "#/components/schemas/HoldingAnalysisHeader"
        score:
          $ref: "#/components/schemas/SignalScore"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisReason"
        technical:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisMetric"
        momentum:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisMetric"
        fundamentals:
          $ref: "#/components/schemas/HoldingFundamentalsBlock"
        catalysts:
          $ref: "#/components/schemas/HoldingCatalystBlock"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRiskFactor"
        outlook:
          $ref: "#/components/schemas/HoldingOutlook"
        priceLevels:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisMetric"
        provenance:
          $ref: "#/components/schemas/AnalysisProvenance"

    HoldingPreviousPick:
      type: object
      required:
        - symbol
        - name
        - scanDate
        - scanPrice
        - score
        - classification
        - classificationLabel
        - riskLevel
        - status
      properties:
        symbol:    { type: string }
        name:      { type: string }
        scanDate:  { type: string }
        scanPrice: { type: number }
        score:     { type: number }
        classification:
          $ref: "#/components/schemas/HoldingClassification"
        classificationLabel: { type: string }
        riskLevel:
          $ref: "#/components/schemas/HoldingRiskLevel"
        currentPrice:   { type: number, nullable: true }
        returnPct:      { type: number, nullable: true }
        return1m:       { type: number, nullable: true }
        return2m:       { type: number, nullable: true }
        return3m:       { type: number, nullable: true }
        maxGainPct:     { type: number, nullable: true }
        maxDrawdownPct: { type: number, nullable: true }
        status:         { type: string }

    HoldingPreviousPicks:
      type: object
      required: [available, note, picks]
      properties:
        available: { type: boolean }
        note:      { type: string }
        picks:
          type: array
          items:
            $ref: "#/components/schemas/HoldingPreviousPick"

    AiAnalysis:
      type: object
      required:
        - id
        - market
        - title
        - subtitle
        - signal
        - signalLabel
        - headline
        - score
        - reasons
        - timeframes
        - multiTimeframe
        - tradePlan
        - risks
        - metrics
        - provenance
      properties:
        id: { type: string }
        market:
          type: string
          enum: [options, intraday, commodities]
        title:    { type: string }
        subtitle: { type: string }
        signal:
          type: string
          enum: [STRONG_BUY, BUY, WATCH, SELL, STRONG_SELL]
        signalLabel: { type: string }
        headline:
          $ref: "#/components/schemas/AnalysisHeadline"
        score:
          $ref: "#/components/schemas/SignalScore"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisReason"
        timeframes:
          type: array
          items:
            $ref: "#/components/schemas/TimeframeTrend"
        multiTimeframe:
          $ref: "#/components/schemas/MultiTimeframeSummary"
        tradePlan:
          $ref: "#/components/schemas/AnalysisTradePlan"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRiskFactor"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisMetric"
        greeks:
          allOf:
            - $ref: "#/components/schemas/AnalysisGreeks"
          nullable: true
        optionChain:
          allOf:
            - $ref: "#/components/schemas/OptionChainContext"
          nullable: true
        provenance:
          $ref: "#/components/schemas/AnalysisProvenance"
